[package]
name = "slop-video-downloader"
version = "0.2.0"
description = "Desktop app to preview YouTube clips, set in/out points, and export H.264 MP4 or AAC M4A via yt-dlp and ffmpeg"
authors = ["Meigo"]
license = "MIT"
edition = "2021"
repository = "https://github.com/meigo/slop-video-downloader"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "slop_video_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tauri-plugin-dialog = "2.7.2"
